# Builds the Linux (x86_64, aarch64) and Windows (x64) desktop app and attaches it to the
# GitHub release of the tag. Runs on version tags (v*) and by hand. Actions are pinned to commit SHAs.
name: desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS: github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Test (crypto vectors, payloads, merge, sync against the real server)
        working-directory: desktop
        run: go test ./core/

  linux:
    needs: test
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            deb: amd64
          - runner: ubuntu-22.04-arm
            arch: aarch64
            deb: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Install GTK and WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Version
        run: echo "VERSION=$(echo '${{ github.ref_name }}' | sed -n 's/^v//p' | grep . || echo 0.0.0-dev)" >> "$GITHUB_ENV"
      - name: Build
        working-directory: desktop
        run: |
          sed -i "s/\"productVersion\": \".*\"/\"productVersion\": \"$VERSION\"/" wails.json
          go run "$WAILS" build -tags webkit2_41 -skipbindings -trimpath -ldflags "-X main.version=$VERSION" -o notallyxyz
      - name: Package (.tar.gz and .deb)
        working-directory: desktop
        run: |
          out="$GITHUB_WORKSPACE/out"; mkdir -p "$out"
          name="NotallyXYZ-linux-${{ matrix.arch }}-$VERSION"
          mkdir -p "pkg/$name"
          cp build/bin/notallyxyz build/linux/notallyxyz.desktop ../LICENSE.md "pkg/$name/"
          cp build/linux/notallyxyz.png "pkg/$name/"
          tar -C pkg -czf "$out/$name.tar.gz" "$name"

          deb=pkg/deb
          install -Dm755 build/bin/notallyxyz "$deb/usr/bin/notallyxyz"
          install -Dm644 build/linux/notallyxyz.desktop "$deb/usr/share/applications/notallyxyz.desktop"
          install -Dm644 build/linux/notallyxyz.png "$deb/usr/share/icons/hicolor/512x512/apps/notallyxyz.png"
          install -Dm644 ../LICENSE.md "$deb/usr/share/doc/notallyxyz/copyright"
          mkdir -p "$deb/DEBIAN"
          cat > "$deb/DEBIAN/control" <<EOF
          Package: notallyxyz
          Version: $VERSION
          Architecture: ${{ matrix.deb }}
          Maintainer: NotallyXYZ <https://github.com/${{ github.repository }}>
          Depends: libgtk-3-0t64 | libgtk-3-0, libwebkit2gtk-4.1-0
          Section: utils
          Priority: optional
          Homepage: https://github.com/${{ github.repository }}
          Description: NotallyX notes with end-to-end encrypted sync
           Notes and lists that sync through your own zero-knowledge server.
          EOF
          dpkg-deb --root-owner-group --build "$deb" "$out/notallyxyz_${VERSION}_${{ matrix.deb }}.deb"
          ls -l "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  windows:
    needs: test
    runs-on: ubuntu-22.04 # the Windows build needs no cgo: cross-compiled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Version
        run: echo "VERSION=$(echo '${{ github.ref_name }}' | sed -n 's/^v//p' | grep . || echo 0.0.0-dev)" >> "$GITHUB_ENV"
      - name: Build
        working-directory: desktop
        run: |
          sed -i "s/\"productVersion\": \".*\"/\"productVersion\": \"$VERSION\"/" wails.json
          go run "$WAILS" build -platform windows/amd64 -skipbindings -trimpath -ldflags "-X main.version=$VERSION"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/bin/NotallyXYZ.exe "$GITHUB_WORKSPACE/out/NotallyXYZ-windows-x64-$VERSION.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: out/*
          if-no-files-found: error

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "NotallyXYZ ${TAG#v}" --notes "Release ${TAG#v}."
          # One SHA256SUMS for all files: add the desktop files to the list of the Android and macOS files.
          cd out
          gh release download "$TAG" -p SHA256SUMS -O existing 2>/dev/null || : > existing
          sha256sum * | grep -v ' existing$' > desktop
          cat existing desktop | sort -k2 -u > SHA256SUMS
          rm existing desktop
          cat SHA256SUMS
          gh release upload "$TAG" * --clobber
